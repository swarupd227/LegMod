name: atlas

x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER:-atlas}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
  POSTGRES_DB: ${POSTGRES_DB:-atlas}

services:

  # ---------------- INFRASTRUCTURE ----------------

  postgres:
    image: postgres:16-alpine
    environment:
      <<: *common-env
    command:
      # Bump connection limit — 13 services × 10 default Hikari conns + tooling
      # easily exceeds the 100-default; 300 leaves comfortable headroom.
      - "postgres"
      - "-c"
      - "max_connections=300"
    ports:
      - "${PORT_POSTGRES:-28432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/atlas_dev_pwd}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${PORT_NEO4J_HTTP:-28474}:7474"
      - "${PORT_NEO4J_BOLT:-28687}:7687"
    volumes:
      - neo4j-data:/data
      - ./infra/neo4j/init.cypher:/init.cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas_dev_pwd}
    ports:
      - "${PORT_MINIO_S3:-28900}:9000"
      - "${PORT_MINIO_CONSOLE:-28001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas_dev_pwd}
      MINIO_BUCKET_CORPUS: ${MINIO_BUCKET_CORPUS:-atlas-corpus}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS:-atlas-artifacts}
    volumes:
      - ./infra/minio/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["sh", "/bootstrap.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-atlas_dev_pwd}"]
    ports:
      - "${PORT_REDIS:-28379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-atlas_dev_pwd}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------- OBSERVABILITY ----------------

  # Jaeger all-in-one — receives OTLP/HTTP from every Atlas service and
  # exposes the trace UI at http://localhost:${PORT_JAEGER_UI}. In
  # production this is replaced by a managed tracing backend (Tempo,
  # AWS X-Ray, Datadog APM); the per-service exporter contract is the
  # same — only OTEL_EXPORTER_OTLP_ENDPOINT changes.
  jaeger:
    # Note: 1.62 was pulled from Docker Hub between releases; pin to the
    # last known-good 1.x tag. Upgrading to Jaeger v2 (image name
    # `jaegertracing/jaeger`) is a separate phase — the OTLP endpoints
    # below stay identical, but the UI port + storage flags change.
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${PORT_JAEGER_UI:-26686}:16686"     # Jaeger query UI
      - "${PORT_JAEGER_OTLP_HTTP:-24318}:4318" # OTLP HTTP collector
      - "${PORT_JAEGER_OTLP_GRPC:-24317}:4317" # OTLP gRPC collector
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Prometheus scrapes /actuator/prometheus on every Atlas service every
  # 15s. Browser access at http://localhost:${PORT_PROMETHEUS} for ad-hoc
  # queries; in production the same scrape config plugs into a managed
  # Prometheus / Mimir / Grafana Cloud instance.
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--web.enable-lifecycle"
    ports:
      - "${PORT_PROMETHEUS:-29090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- TEMPORAL ----------------

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
      POSTGRES_SEEDS: postgres
      POSTGRES_DB: temporal
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "${PORT_TEMPORAL:-28233}:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${PORT_TEMPORAL_UI:-8088}:8080"

  # ---------------- APPLICATION SERVICES ----------------

  api-gateway:
    build:
      context: ./services/api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      fake-idp:
        condition: service_started
    environment:
      # `auth-sim` is the local-Docker default — it activates the
      # fake-idp profile in application.yml. To run against a real OIDC
      # provider, set SPRING_PROFILES_ACTIVE=auth-real and pass
      # OIDC_ISSUER_URI (the customer's discovery URL).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-auth-sim}
      PRJ_SERVICE_URL: http://prj-service:8081
      LLM_GATEWAY_URL: http://llm-gateway:8082
      ARCH_SERVICE_URL: http://arch-service:8083
      # The gateway is in-container so it fetches JWKS over the docker
      # network; the browser sees fake-idp on the host port mapping.
      FAKE_IDP_ISSUER: ${FAKE_IDP_ISSUER:-http://localhost:${PORT_FAKE_IDP:-8093}}
      FAKE_IDP_JWKS:   http://fake-idp:8093/.well-known/jwks.json
      # Default false so customer-facing recordings don't show the
      # "Demo identity" pill. Set ATLAS_SHOW_DEMO_BADGE=true locally
      # to surface it again (useful for engineers debugging which
      # persona they're signed in as).
      ATLAS_SHOW_DEMO_BADGE: ${ATLAS_SHOW_DEMO_BADGE:-false}
    ports:
      - "${PORT_GATEWAY:-8080}:8080"

  fake-idp:
    build:
      context: ./services/fake-idp
    environment:
      # Issuer URL the JWT iss claim carries — must match what browsers see.
      FAKE_IDP_ISSUER: ${FAKE_IDP_ISSUER:-http://localhost:${PORT_FAKE_IDP:-8093}}
    ports:
      - "${PORT_FAKE_IDP:-8093}:8093"
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:8093/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prj-service:
    build:
      context: ./services/prj-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
      ARCH_SERVICE_URL: http://arch-service:8083
      CAP_SERVICE_URL: http://cap-service:8085
      RECON_SERVICE_URL: http://recon-service:8086
      GEN_SERVICE_URL: http://gen-service:8087
      DIFF_SERVICE_URL: http://diff-service:8089
      REPORTS_SERVICE_URL: http://reports-service:8090
      UPLIFT_SERVICE_URL: http://uplift-service:8092
      # /uploads is the destination for source ingested via the
      # SPA's "Upload .zip" or "GitHub URL" flow. prj-service writes
      # here when extracting / cloning; arch / cap / recon / uplift
      # mount the same directory read-only so the analysis agents
      # can walk the ingested tree.
      UPLOADS_DIR: /uploads
    volumes:
      - ./uploads:/uploads
    ports:
      - "${PORT_PRJ:-8081}:8081"

  arch-service:
    build:
      context: ./services/arch-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
      LLM_GATEWAY_URL: http://llm-gateway:8082
      GRAPH_SERVICE_URL: http://graph-service:8084
      PROV_SERVICE_URL: http://prov-service:8091
    volumes:
      - ./samples:/samples:ro
      - ./uploads:/uploads:ro
    ports:
      - "${PORT_ARCH:-8083}:8083"

  graph-service:
    build:
      context: ./services/graph-service
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: atlas_dev_pwd
    ports:
      - "${PORT_GRAPH:-8084}:8084"

  cap-service:
    build:
      context: ./services/cap-service
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas_dev_pwd}
      MINIO_BUCKET_CORPUS: ${MINIO_BUCKET_CORPUS:-atlas-corpus}
    volumes:
      - ./samples:/samples:ro
      - ./uploads:/uploads:ro
    ports:
      - "${PORT_CAP:-8085}:8085"

  recon-service:
    build:
      context: ./services/recon-service
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas_dev_pwd}
      MINIO_BUCKET_CORPUS: ${MINIO_BUCKET_CORPUS:-atlas-corpus}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS:-atlas-artifacts}
      LLM_GATEWAY_URL: http://llm-gateway:8082
      ARCH_SERVICE_URL: http://arch-service:8083
      PROV_SERVICE_URL: http://prov-service:8091
    volumes:
      - ./samples:/samples:ro
      - ./uploads:/uploads:ro
    ports:
      - "${PORT_RECON:-8086}:8086"

  gen-service:
    build:
      context: ./services/gen-service
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas_dev_pwd}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS:-atlas-artifacts}
      ARCH_SERVICE_URL: http://arch-service:8083
      PROV_SERVICE_URL: http://prov-service:8091
    volumes:
      # Read-write so the Stage F Build & Test gate can run
      # `mvn test` inside the UPLIFT project's source tree (mvn
      # writes target/, target/test-classes/, etc).
      - .\uploads:/uploads
    ports:
      - "${PORT_GEN:-8087}:8087"

  diff-service:
    build:
      context: ./services/diff-service
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas_dev_pwd}
      MINIO_BUCKET_CORPUS: ${MINIO_BUCKET_CORPUS:-atlas-corpus}
      LLM_GATEWAY_URL: http://llm-gateway:8082
      PROV_SERVICE_URL: http://prov-service:8091
    ports:
      - "${PORT_DIFF:-8089}:8089"

  reports-service:
    build:
      context: ./services/reports-service
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas_dev_pwd}
      MINIO_BUCKET_ARTIFACTS: ${MINIO_BUCKET_ARTIFACTS:-atlas-artifacts}
      LLM_GATEWAY_URL: http://llm-gateway:8082
      PRJ_SERVICE_URL: http://prj-service:8081
      ARCH_SERVICE_URL: http://arch-service:8083
      CAP_SERVICE_URL: http://cap-service:8085
      RECON_SERVICE_URL: http://recon-service:8086
      GEN_SERVICE_URL: http://gen-service:8087
      DIFF_SERVICE_URL: http://diff-service:8089
      PROV_SERVICE_URL: http://prov-service:8091
    ports:
      - "${PORT_REPORTS:-8090}:8090"

  prov-service:
    build:
      context: ./services/prov-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
    ports:
      - "${PORT_PROV:-8091}:8091"

  uplift-service:
    build:
      context: ./services/uplift-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_pwd}
      PROV_SERVICE_URL: http://prov-service:8091
    volumes:
      - ./samples:/samples:ro
      # Read-write: MigrationService writes recipe-transformed Java files
      # back into the cloned source tree so the Stage F Build & Test gate
      # can compile + test the migrated code. The uploads tree is our
      # working clone, never the customer's actual repo.
      - ./uploads:/uploads
    ports:
      - "${PORT_UPLIFT:-8092}:8092"

  llm-gateway:
    build:
      context: ./services/llm-gateway
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL_OPUS: ${LLM_MODEL_OPUS:-claude-opus-4-7}
      LLM_MODEL_SONNET: ${LLM_MODEL_SONNET:-claude-sonnet-4-6}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-sonnet}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-atlas_dev_pwd}
    ports:
      - "${PORT_LLM:-8082}:8082"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api-gateway
    environment:
      VITE_API_BASE: http://localhost:${PORT_GATEWAY:-8080}
    ports:
      - "${PORT_FRONTEND:-3000}:3000"

volumes:
  postgres-data:
  neo4j-data:
  minio-data:
  redis-data:
  prometheus-data:
