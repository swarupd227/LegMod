name: ci

# Runs on every PR and on pushes to main. The three jobs are independent —
# Java tests, frontend Vitest, and Playwright E2E run in parallel. The Java
# job fans out into a per-service matrix so a slow service doesn't block
# the rest.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # security-events lets the image-scan job upload Trivy SARIF results
  # to the Security tab. packages lets us push images to GHCR on the
  # main-branch path. Both default-deny everywhere else; see job-level
  # `permissions` blocks below for the gates.
  security-events: write
  packages: write

concurrency:
  # Cancel in-flight runs for the same ref so a fresh push supersedes the
  # previous one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------- #
  # Java unit + integration tests, per service.                      #
  # ---------------------------------------------------------------- #
  java-tests:
    name: java · ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - arch-service
          - cap-service
          - diff-service
          - fake-idp
          - gen-service
          - prj-service
          - prov-service
          - recon-service
          - reports-service
          - uplift-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Linux runners ship with a working docker daemon, so Testcontainers
      # boots clean — none of the named-pipe quirks Windows Docker Desktop
      # has. `mvn verify` runs Surefire (unit + integration), the JaCoCo
      # agent, and JaCoCo's check execution (currently enforced on
      # uplift-service at 70%; report-only on the others — see
      # docs/testing.md).
      - name: mvn verify
        working-directory: services/${{ matrix.service }}
        run: mvn -B -ntp verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- #
  # Frontend unit tests (Vitest + RTL + jsdom).                      #
  # ---------------------------------------------------------------- #
  frontend-tests:
    name: frontend · vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        # `npm ci` is strict — fails if package-lock.json is out of sync.
        # If you don't have a lock file yet, switch this to `npm install`
        # for the first run and commit the produced lock file.
        run: npm ci || npm install

      - name: codegen:check (api contract drift)
        # Re-runs `openapi-typescript` against the checked-in OpenAPI
        # specs and fails if `src/api/generated/*` is stale relative to
        # them. Catches the case where someone edits a JSON spec without
        # regenerating the TS, or vice versa. See docs/api-contracts.md.
        run: npm run codegen:check

      - name: vitest
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------- #
  # End-to-end (Playwright, API-mocked mode).                        #
  # ---------------------------------------------------------------- #
  e2e:
    name: frontend · playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: frontend-tests   # short-circuit if Vitest fails
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci || npm install

      # Playwright bundles its own Chromium build. We only install Chromium
      # plus its OS deps — Firefox and WebKit are not exercised by the
      # current suite.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: playwright test
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------- #
  # Helm chart lint + template render. Cheap, runs on every PR so a  #
  # broken chart fails fast next to the unit tests.                  #
  # ---------------------------------------------------------------- #
  helm-lint:
    name: helm · lint + template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint helm/atlas

      - name: helm template (default values)
        # Confirms the chart renders without errors. The output is
        # discarded — we just want the parser + template engine to
        # succeed for every services.* entry.
        run: helm template atlas helm/atlas > /dev/null

      - name: helm template (production values stub)
        # Re-renders with auth-real + secrets wired so the prod-shaped
        # branches of spring-service.yaml are exercised too.
        run: |
          helm template atlas helm/atlas \
            --set global.springProfile=auth-real \
            --set global.secrets.oidcSecretName=atlas-oidc \
            --set global.secrets.llmSecretName=atlas-llm \
            --set "services.fake-idp.enabled=false" \
            --set ingress.enabled=true \
            > /dev/null

  # ---------------------------------------------------------------- #
  # Image build + Trivy scan + Syft SBOM. Release-side check only —  #
  # runs on push to main (and on tag) so PRs stay fast. The matrix   #
  # builds + scans every Atlas service in parallel.                  #
  # ---------------------------------------------------------------- #
  image-scan:
    name: image · ${{ matrix.service }} · scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - arch-service
          - cap-service
          - diff-service
          - fake-idp
          - gen-service
          - graph-service
          - llm-gateway
          - prj-service
          - prov-service
          - recon-service
          - reports-service
          - uplift-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          load: true       # load into the runner's local docker so Trivy can scan it
          push: false
          tags: atlas-${{ matrix.service }}:scan
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy vulnerability scan (HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: atlas-${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          # Don't fail the build on findings — just publish the SARIF
          # so the Security tab and ops can triage. Promote to
          # exit-code: 1 once the team has a baseline of accepted CVEs.
          exit-code: '0'
          format: sarif
          output: trivy-${{ matrix.service }}.sarif

      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Generate SBOM (Syft, SPDX-JSON)
        uses: anchore/sbom-action@v0
        with:
          image: atlas-${{ matrix.service }}:scan
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: ${{ runner.temp }}/sbom-${{ matrix.service }}.spdx.json
          if-no-files-found: warn
          retention-days: 90
