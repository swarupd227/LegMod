server:
  port: 8084

spring:
  application:
    name: graph-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # OpenTelemetry tracing — see docs/observability.md. Override
  # OTEL_EXPORTER_OTLP_ENDPOINT for production.
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
      transport: http
